[package]
name = "rs-redb-dump-kvpairs2jsonl"
version = "0.1.0"
edition = "2024"

description = "Dump redb key-value pairs to JSONL"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-redb-dump-kvpairs2jsonl"
homepage = "https://github.com/takanoriyanagitani/rs-redb-dump-kvpairs2jsonl"
documentation = "https://docs.rs/rs-redb-dump-kvpairs2jsonl/latest"
keywords = ["redb", "json", "dump", "wasi", "jsonl"]

exclude = [
	"redb2kvpairs2jsonl.wasm",
]

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "redb2kvpairs2jsonl"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[dependencies.serde_json]
version = "1.0.151"
default-features = false
features = [
  "std",
]

[dependencies.redb]
version = "4.3.0"
default-features = false
features = [
  "std",
]
